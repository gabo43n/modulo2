openapi: 3.0.3
info:
  title: Agenda Telefónica API
  description: |
    API REST para una aplicación móvil de agenda telefónica.

    Permite gestionar contactos, números de teléfono, grupos/etiquetas, favoritos,
    búsqueda, índice alfabético y sincronización incremental.

    ## Autenticación
    La mayoría de endpoints requieren un token JWT en el header:
    ```
    Authorization: Bearer <token>
    ```
  version: 1.0.0
  contact:
    name: API Support
    email: support@agenda.com

servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo

tags:
  - name: Auth
    description: Registro, login y perfil de usuario
  - name: Contacts
    description: Gestión de contactos
  - name: Groups
    description: Grupos y etiquetas de contactos
  - name: Health
    description: Estado del servicio
  - name: CLM
    description: >-
      Modulo de solo lectura que expone empresa_cliente/contrato/clausula
      desde PostgreSQL (practico del diplomado, no forma parte de la agenda)

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      description: Verifica que el servicio esté activo
      operationId: healthCheck
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/clm/health:
    get:
      tags: [CLM]
      summary: Estado de la conexion a PostgreSQL
      operationId: clmHealth
      responses:
        '200':
          description: Conectado a PostgreSQL
        '503':
          description: Sin conexion a PostgreSQL

  /api/clm/empresas:
    get:
      tags: [CLM]
      summary: Listar empresas cliente (tabla empresa_cliente)
      operationId: clmListEmpresas
      responses:
        '200':
          description: Lista de empresas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id_empresa: { type: string, format: uuid }
                    razon_social: { type: string }
                    nit: { type: string }
                    pais: { type: string }
                    fecha_registro: { type: string, format: date-time }
                    activo: { type: boolean }

    post:
      tags: [CLM]
      summary: Crear una empresa cliente
      operationId: clmCreateEmpresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [razon_social, nit, pais]
              properties:
                razon_social: { type: string, example: "Constructora Andina S.A." }
                nit: { type: string, example: "1234567890" }
                direccion_fiscal: { type: string, nullable: true }
                pais: { type: string, example: "Bolivia" }
                activo: { type: boolean, default: true }
      responses:
        '201':
          description: Empresa creada
        '400':
          description: Datos invalidos
        '409':
          description: Ya existe una empresa con ese NIT

  /api/clm/contratos:
    get:
      tags: [CLM]
      summary: Listar contratos (tabla contrato, con nombre de empresa)
      operationId: clmListContratos
      responses:
        '200':
          description: Lista de contratos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id_contrato: { type: string, format: uuid }
                    titulo: { type: string }
                    contraparte_nombre: { type: string }
                    estado:
                      type: string
                      enum: [Borrador, Negociacion, Validez_Legal, Anulado, Expirado]
                    fecha_inicio_vigencia: { type: string, format: date, nullable: true }
                    fecha_fin_vigencia: { type: string, format: date, nullable: true }
                    valor_contrato: { type: number, nullable: true }
                    moneda: { type: string, nullable: true }
                    empresa: { type: string }

    post:
      tags: [CLM]
      summary: Crear un contrato
      operationId: clmCreateContrato
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_empresa, titulo, contraparte_nombre]
              properties:
                id_empresa: { type: string, format: uuid }
                titulo: { type: string }
                contraparte_nombre: { type: string }
                estado:
                  type: string
                  enum: [Borrador, Negociacion, Validez_Legal, Anulado, Expirado]
                  default: Borrador
                fecha_inicio_vigencia: { type: string, format: date, nullable: true }
                fecha_fin_vigencia: { type: string, format: date, nullable: true }
                valor_contrato: { type: number, nullable: true }
                moneda: { type: string, nullable: true, example: "BOB" }
      responses:
        '201':
          description: Contrato creado
        '400':
          description: Datos invalidos (o id_empresa que no existe)

  /api/clm/clausulas:
    get:
      tags: [CLM]
      summary: Listar clausulas (tabla clausula, con titulo de contrato)
      operationId: clmListClausulas
      responses:
        '200':
          description: Lista de clausulas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id_clausula: { type: string, format: uuid }
                    orden: { type: integer }
                    titulo: { type: string }
                    tipo_clausula: { type: string }
                    es_modificable: { type: boolean }
                    version: { type: integer }
                    contrato: { type: string }

    post:
      tags: [CLM]
      summary: Crear una clausula
      operationId: clmCreateClausula
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_contrato, orden, titulo, contenido]
              properties:
                id_contrato: { type: string, format: uuid }
                orden: { type: integer, minimum: 1 }
                titulo: { type: string }
                contenido: { type: string }
                tipo_clausula: { type: string, default: estandar }
                es_modificable: { type: boolean, default: true }
      responses:
        '201':
          description: Clausula creada
        '400':
          description: Datos invalidos (o id_contrato que no existe)

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registrar usuario
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Obtener perfil
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Auth]
      summary: Actualizar perfil
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/auth/me/password:
    put:
      tags: [Auth]
      summary: Cambiar contraseña
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Contraseña actualizada correctamente
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me/stats:
    get:
      tags: [Auth]
      summary: Estadísticas del usuario
      operationId: getStats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estadísticas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contacts:
    get:
      tags: [Contacts]
      summary: Listar contactos
      description: Lista contactos con paginación, búsqueda y filtros
      operationId: listContacts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - name: search
          in: query
          description: Buscar por nombre, apellido, empresa, email o teléfono
          schema:
            type: string
        - name: favorite
          in: query
          schema:
            type: boolean
        - name: groupId
          in: query
          schema:
            type: integer
        - name: letter
          in: query
          description: Filtrar por letra inicial del nombre
          schema:
            type: string
            maxLength: 1
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [firstName, lastName, createdAt, updatedAt]
            default: firstName
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Lista paginada de contactos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Contacts]
      summary: Crear contacto
      operationId: createContact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
      responses:
        '201':
          description: Contacto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contacts/favorites:
    get:
      tags: [Contacts]
      summary: Listar favoritos
      operationId: listFavorites
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Contactos favoritos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contacts/recent:
    get:
      tags: [Contacts]
      summary: Contactos recientes
      description: Contactos modificados recientemente
      operationId: listRecentContacts
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: Contactos recientes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contacts/index:
    get:
      tags: [Contacts]
      summary: Índice alfabético
      description: Cantidad de contactos por letra inicial
      operationId: getContactIndex
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Índice alfabético
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LetterIndex'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contacts/sync:
    get:
      tags: [Contacts]
      summary: Sincronización incremental
      description: Obtiene cambios desde una fecha (útil para apps móviles offline)
      operationId: syncContacts
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: true
          description: Fecha ISO 8601 desde la cual obtener cambios
          schema:
            type: string
            format: date-time
          example: '2026-01-01T00:00:00.000Z'
      responses:
        '200':
          description: Cambios desde la fecha indicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/contacts/{id}:
    get:
      tags: [Contacts]
      summary: Obtener contacto
      operationId: getContact
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/contactId'
      responses:
        '200':
          description: Detalle del contacto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Contacts]
      summary: Actualizar contacto
      operationId: updateContact
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/contactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactRequest'
      responses:
        '200':
          description: Contacto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Contacts]
      summary: Eliminar contacto
      operationId: deleteContact
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/contactId'
      responses:
        '204':
          description: Contacto eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/contacts/{id}/favorite:
    patch:
      tags: [Contacts]
      summary: Alternar favorito
      description: Marca o desmarca un contacto como favorito
      operationId: toggleFavorite
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/contactId'
      responses:
        '200':
          description: Contacto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/groups:
    get:
      tags: [Groups]
      summary: Listar grupos
      operationId: listGroups
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de grupos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Groups]
      summary: Crear grupo
      operationId: createGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Grupo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/groups/{id}:
    get:
      tags: [Groups]
      summary: Obtener grupo
      operationId: getGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/groupId'
      responses:
        '200':
          description: Detalle del grupo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Groups]
      summary: Actualizar grupo
      operationId: updateGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/groupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Grupo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Groups]
      summary: Eliminar grupo
      operationId: deleteGroup
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/groupId'
      responses:
        '204':
          description: Grupo eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/groups/{id}/contacts:
    get:
      tags: [Groups]
      summary: Contactos del grupo
      operationId: getGroupContacts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/groupId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Contactos del grupo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupContactsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    contactId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    groupId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto (recurso duplicado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: agenda-telefonica-api
        version:
          type: string
          example: 1.0.0
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT válido por 7 días

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6

    UserStats:
      type: object
      properties:
        totalContacts:
          type: integer
        favoriteContacts:
          type: integer
        totalGroups:
          type: integer

    PhoneNumber:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [mobile, home, work, other]
        number:
          type: string
          example: '+54 11 5555-1234'
        isPrimary:
          type: boolean

    PhoneNumberInput:
      type: object
      required: [number]
      properties:
        type:
          type: string
          enum: [mobile, home, work, other]
          default: mobile
        number:
          type: string
        isPrimary:
          type: boolean
          default: false

    GroupSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
          example: '#3B82F6'

    Group:
      allOf:
        - $ref: '#/components/schemas/GroupSummary'
        - type: object
          properties:
            contactCount:
              type: integer
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    Contact:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
        company:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        address:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        photoUrl:
          type: string
          format: uri
          nullable: true
        isFavorite:
          type: boolean
        phones:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumber'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateContactRequest:
      type: object
      required: [firstName]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        company:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        notes:
          type: string
        photoUrl:
          type: string
          format: uri
        isFavorite:
          type: boolean
        phones:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumberInput'
        groupIds:
          type: array
          items:
            type: integer

    UpdateContactRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        company:
          type: string
        email:
          type: string
          format: email
        address:
          type: string
        notes:
          type: string
        photoUrl:
          type: string
          format: uri
        isFavorite:
          type: boolean
        phones:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumberInput'
        groupIds:
          type: array
          items:
            type: integer

    Pagination:
      type: object
